<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sail Plan</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #12161c;
    color: #e6e9ef;
  }
  header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: #1b212b;
    border-bottom: 1px solid #2a3241;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1 1 auto; }
  button, select, input[type=number], input[type=text] {
    font: inherit;
    background: #262f3d;
    color: #e6e9ef;
    border: 1px solid #3a4456;
    border-radius: 6px;
    padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: #303b4d; }
  button.primary { background: #2e7d32; border-color: #2e7d32; }
  button.primary:hover { background: #34903a; }
  button.danger { background: #7d2e2e; border-color: #7d2e2e; }
  button:disabled { opacity: .4; cursor: default; }
  /* Margins, not flex `gap`: Chromium 69 (the MFD) ignores gap and the items touch. */
  header > #area-readout, header > button { margin-left: 12px; }
  #status:not(:empty), #problems:not(:empty) { margin-top: 6px; }
  .hotspot-row > * + * { margin-left: 6px; }
  #hs-clear { margin-left: 6px; }
  #status { font-size: 12px; color: #9aa4b2; flex-basis: 100%; }
  #problems { flex-basis: 100%; font-size: 12px; }
  #problems div { padding: 1px 0; }
  #problems .error { color: #ff8a80; }
  #problems .nodata { color: #9aa4b2; }
  #area-readout { font-size: 13px; color: #9aa4b2; }
  #area-readout strong { color: #e6e9ef; }

  body { display: flex; flex-direction: column; height: 100vh; }
  header { flex: 0 0 auto; }
  #layout { display: flex; flex: 1 1 auto; min-height: 0; }
  #stage-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
  }
  /* #stage and img are given an explicit pixel width/height by JS
     (resizeStage), not CSS. Neither plain %/vw sizing nor width:auto
     covers this: an image can have a tiny intrinsic size (e.g. an SVG
     with viewBox "0 0 100 100") that CSS auto-sizing never scales up
     past, and vw/vh ignores the edit sidebar shrinking the available
     area. Computing the box in JS from the image's real aspect ratio
     also keeps the %-coordinate hotspot overlay pixel-aligned with the
     image — no object-fit letterbox gap to account for. */
  #stage {
    position: relative;
    line-height: 0;
  }
  #stage img { display: block; user-select: none; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #overlay polygon {
    fill: rgba(255,255,255,0.06);
    stroke: #6b7686;
    stroke-width: 0.4;
    vector-effect: non-scaling-stroke;
    cursor: pointer;
    transition: fill .12s, stroke-width .12s;
  }
  /* Button-like feedback: a visible hover state on every sail (so it
     reads as clickable before it's set), and a solid — not just
     tinted — fill once active so the whole sail clearly changes color. */
  #overlay polygon:hover { fill: rgba(255,255,255,0.24); stroke-width: 0.9; }
  #overlay polygon.active { fill: rgba(46,204,113,0.85); stroke: #2ecc71; stroke-width: 0.7; }
  #overlay polygon.active:hover { fill: rgba(56,224,123,0.95); }
  #overlay polygon.reefed { fill: rgba(241,196,15,0.85); stroke: #f1c40f; stroke-width: 0.7; }
  #overlay polygon.reefed:hover { fill: rgba(250,210,40,0.95); }
  #overlay circle.point { fill: #ff5252; stroke: #fff; stroke-width: 0.4; vector-effect: non-scaling-stroke; }
  #overlay polyline.drawing { fill: none; stroke: #ff5252; stroke-width: 0.4; vector-effect: non-scaling-stroke; }
  #overlay text.hlabel { font-size: 3px; fill: #fff; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #000; stroke-width: 0.5px; }

  #empty-msg { color: #9aa4b2; text-align: center; padding: 40px; }

  #sidebar {
    width: 300px;
    flex: 0 0 auto;
    border-left: 1px solid #2a3241;
    background: #161b23;
    padding: 12px;
    overflow-y: auto;
    display: none;
  }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #9aa4b2; margin: 16px 0 8px; }
  #sidebar h2:first-child { margin-top: 0; }
  .form-row { display: flex; flex-direction: column; margin-bottom: 8px; }
  .form-row > * + * { margin-top: 4px; }
  .form-row label { font-size: 12px; color: #9aa4b2; }
  .hotspot-row {
    display: flex; align-items: center;
    padding: 6px 4px; border-bottom: 1px solid #232b38; font-size: 13px;
  }
  .hotspot-row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { font-size: 12px; color: #9aa4b2; line-height: 1.4; }
</style>
</head>
<body>

<header>
  <h1>Sail Plan</h1>
  <div id="area-readout"></div>
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none">
  <button id="upload-btn">Upload sail plan…</button>
  <button id="mode-btn">Edit hotspots</button>
  <div id="status"></div>
  <div id="problems"></div>
</header>

<div id="layout">
  <div id="stage-wrap">
    <div id="stage">
      <img id="sail-image" alt="Sail plan" style="display:none">
      <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
    <div id="empty-msg">Loading…</div>
  </div>

  <div id="sidebar">
    <h2>New hotspot</h2>
    <p class="hint">Click points on the image to trace the sail's outline (min. 3), then fill this in and press "Add".</p>
    <div class="form-row">
      <label>Sail</label>
      <select id="hs-sail"></select>
    </div>
    <div class="form-row">
      <label>Reef level (0 = full sail / set)</label>
      <input type="number" id="hs-reef" min="0" value="0">
    </div>
    <div class="form-row">
      <label>Label</label>
      <input type="text" id="hs-label" placeholder="e.g. Main - Reef 1">
    </div>
    <div style="display:flex;">
      <button id="hs-add" class="primary">Add hotspot</button>
      <button id="hs-clear">Clear points</button>
    </div>

    <h2>Hotspots (<span id="hs-count">0</span>)</h2>
    <div id="hs-list"></div>

    <h2></h2>
    <button id="save-btn" class="primary" style="width:100%;">Save hotspots</button>
  </div>
</div>

<script src="http-problems.js"></script>
<script src="app.js"></script>
<script>
// If app.js did not start (a syntax this browser cannot parse, or it failed to load),
// say so instead of leaving the page looking like an empty sail plan.
setTimeout(function () {
  if (window.sailplanStarted) return;
  var m = document.getElementById('empty-msg');
  m.textContent = 'The page script did not start, so nothing can be shown. See the browser console for the error.';
  m.style.display = 'block';
}, 6000);
</script>
</body>
</html>
